name = "liff-family-tool"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "family-tool-db"
database_id = "1e5b323a-2385-4f1b-a66f-3afe26e38657"

# Environment variables (set via wrangler secret put)
# LINE_CHANNEL_ACCESS_TOKEN
# LINE_CHANNEL_SECRET
# LIFF_ID

[vars]
ENVIRONMENT = "production"

# Assets for LIFF frontend
[site]
bucket = "./public"
